[package]
name = "voiceflow"
version = "0.1.0"
description = "Local-first push-to-talk dictation"
authors = ["VoiceFlow contributors"]
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "voiceflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2"
tokio = { version = "1.54.1", features = ["rt", "sync", "time", "macros"] }
futures-util = "0.3.34"
cpal = "0.18"
rtrb = "0.4"
rubato = "5"
zeroize = "1"
sha2 = "0.10"
ureq = { version = "3", default-features = false, features = ["rustls"] }
arboard = { version = "3.7.0", features = ["wayland-data-control"], default-features = false }
enigo = { version = "0.6", features = ["wayland"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"


[features]
default = ["layer-shell", "needle"]
# Link the official Cactus Needle engine for on-device speech recognition.
# Requires `bun run fetch:needle` before building.
needle = []
# Wayland layer-shell overlay placement (Linux). Needs the system gtk-layer-shell library.
layer-shell = ["dep:gtk-layer-shell", "dep:gtk"]

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "global_shortcuts"] }
evdev = "0.13.2"
gtk = { version = "0.18", optional = true }
gtk-layer-shell = { version = "0.8.2", optional = true, features = ["v0_6"] }
libc = "0.2.191"
x11rb = "0.13"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
hound = "3.5"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "test-util"] }

[[example]]
name = "bench_whistle"
required-features = ["needle"]

[[test]]
name = "whistle"
required-features = ["needle"]
