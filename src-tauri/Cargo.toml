[package]
name = "voiceflow"
version = "0.1.0"
description = "Local-first push-to-talk dictation"
authors = ["VoiceFlow contributors"]
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "voiceflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2"
tokio = { version = "1.54.1", features = ["rt", "sync", "time", "macros"] }
futures-util = "0.3.34"


[features]
default = ["layer-shell"]
# Wayland layer-shell overlay placement (Linux). Needs the system gtk-layer-shell library.
layer-shell = ["dep:gtk-layer-shell", "dep:gtk"]

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "global_shortcuts"] }
evdev = "0.13.2"
gtk = { version = "0.18", optional = true }
gtk-layer-shell = { version = "0.8.2", optional = true, features = ["v0_6"] }
libc = "0.2.191"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "test-util"] }
